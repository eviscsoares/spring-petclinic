name: Test OIDC Authentication

on:
  push:
    branches: [ "main" ]

permissions:
  id-token: write  # Crucial para habilitar a geração de tokens OIDC no runner
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  test-oidc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Test with AWS credentials action
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com # Força o GitHub a carregar a assinatura aceita pela AWS

      - name: List ECR repositories
        run: |
          aws ecr describe-repositories

name: Test OIDC Authentication

on:
  push:
    branches: [ "main" ]

permissions:
  id-token: write  # Obrigatório para gerar o token OIDC correto
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  test-oidc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Deixe apenas a Action oficial fazer o trabalho pesado
      - name: Test with AWS credentials action
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Se a autenticação funcionar, este passo vai listar seus repositórios
      - name: List ECR repositories
        run: |
          aws ecr describe-repositories

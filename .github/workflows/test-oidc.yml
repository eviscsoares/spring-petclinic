name: Test OIDC Authentication

on:
  push:
    branches: [ "main" ]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  test-oidc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Test with AWS credentials action
        # Atualizado para a subversão estável que corrige problemas de handshake OIDC
        uses: aws-actions/configure-aws-credentials@v4.1.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: https://amazonaws.com # Força o cabeçalho correto no token do GitHub
          aws-sts-regional-endpoints: "regional"

      - name: List ECR repositories
        run: |
          aws ecr describe-repositories
